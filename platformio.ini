[base]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8

[env:debug]
extends = base
build_flags =
    -DDEBUG=1
    ; Route Serial over the C3's built-in USB port
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:dev]
extends = base
build_flags =
    ${env:debug.build_flags}
    -DSTAY_AWAKE_INITIAL=1

[env:release]
extends = base
