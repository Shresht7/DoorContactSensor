# ---------------------
# ESPHome Configuration
# ---------------------

esphome:
  name: esphome-web-66b248
  friendly_name: Door Sensor
  min_version: 2025.10.0

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  on_client_connected:
    then:
      - deep_sleep.prevent: deep_sleep_control
  on_client_disconnected:
    then:
      - deep_sleep.allow: deep_sleep_control

# Allow Over-The-Air updates
ota:
  - platform: esphome

# ----
# WIFI
# ----

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: 192.168.0.240
    gateway: 192.168.0.1
    subnet: 255.255.255.0

# -------
# SENSORS
# -------

binary_sensor:
  # === Magnetic Reed Sensor ===
  - name: "Door Status"
    platform: gpio
    device_class: door
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      allow_other_uses: true
    filters:
      - delayed_on_off: 50ms
    on_press: # Triggers when door OPENS
      then:
        - light.turn_on: onboard_blue_led
        - delay: 1s
        - light.turn_off: onboard_blue_led
        - script.execute: consider_deep_sleep
    on_release: # Triggers when door CLOSES
      then:
        - light.turn_on: onboard_blue_led
        - delay: 100ms
        - light.turn_off: onboard_blue_led
        - script.execute: consider_deep_sleep

light:
  # === Onboard LED ===
  - platform: status_led
    id: onboard_blue_led
    pin: GPIO8

switch:
  # === Prevent Deep Sleep (Debug Switch) ===
  - platform: template
    name: "Prevent Deep Sleep"
    id: prevent_deep_sleep
    optimistic: true

# -------
# SCRIPTS
# -------

script:
  - id: consider_deep_sleep
    then:
      - if:
          condition:
            switch.is_off: prevent_deep_sleep
          then:
            - wait_until:
                condition:
                  api.connected:
                timeout: 15s
            - delay: 500ms  # small buffer so the published state actually flushes
            - deep_sleep.enter: deep_sleep_control
          else:
            - logger.log: "Deep sleep prevented by switch"

# ----------
# DEEP SLEEP
# ----------

deep_sleep:
  id: deep_sleep_control
  run_duration: 30s
  wakeup_pin:
    number: GPIO4
    mode: INPUT_PULLUP
    allow_other_uses: true
  wakeup_pin_mode: INVERT_WAKEUP
