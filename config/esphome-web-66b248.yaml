# ---------------------
# ESPHome Configuration
# ---------------------

esphome:
  name: esphome-web-66b248
  friendly_name: Door Sensor
  min_version: 2025.10.0

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome

# ----
# WIFI
# ----

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: 192.168.0.240
    gateway: 192.168.0.1
    subnet: 255.255.255.0

# -------
# SENSORS
# -------

binary_sensor:
  # === Magnetic Reed Sensor ===
  - name: "Door Status"
    platform: gpio
    device_class: door
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      allow_other_uses: true

light:
  # === Onboard LED ===
  - platform: status_led
    id: onboard_blue_led
    pin: GPIO8

# ----------
# DEEP SLEEP
# ----------

deep_sleep:
  run_duration: 10s
  wakeup_pin:
    number: GPIO4
    mode: INPUT_PULLUP
    allow_other_uses: true
  wakeup_pin_mode: INVERT_WAKEUP
