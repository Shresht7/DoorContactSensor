# ---------------------
# ESPHome Configuration
# ---------------------

esphome:
  name: esphome-web-66b248
  friendly_name: Door Sensor
  min_version: 2025.10.0

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome

# ----
# WIFI
# ----

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# -------
# SENSORS
# -------

binary_sensor:
  # === Magnetic Reed Sensor ===
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
    name: "Door Status"
    device_class: door

light:
  # === Onboard LED ===
  - platform: status_led
    pin: GPIO8
    id: onboard_blue_led
